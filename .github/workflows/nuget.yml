name: Build and Publish NuGet Package

on:
  push:
    tags:
      - "v*.*.*"  # Trigger only on version tags (e.g., v1.1.0)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore -p:Version="$VERSION"

      - name: Run tests (exclude integration)
        run: dotnet test tests/Invensys.ExternalApi.UnitTests/Invensys.ExternalApi.UnitTests.csproj --configuration Release --no-build --no-restore --verbosity normal


      - name: Pack NuGet packages
        run: |
          mkdir -p ./nupkg
          for csproj in $(find ./src -name '*.csproj'); do
            dotnet pack "$csproj" --configuration Release --no-build --no-restore --output ./nupkg -p:Version="$VERSION"
          done

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in ./nupkg/*.nupkg; do
            dotnet nuget push "$package" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
